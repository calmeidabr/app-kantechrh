name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build da imagem
        run: docker build -t ghcr.io/${{ github.repository_owner }}/app-kantechrh:latest .

      - name: Publish da imagem
        run: docker push ghcr.io/${{ github.repository_owner }}/app-kantechrh:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos no VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /docker/app-kantechrh
            git pull origin main
            docker compose up -d --build --remove-orphans
